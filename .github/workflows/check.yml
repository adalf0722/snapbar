name: Repository checks
on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changes
        id: changes
        shell: pwsh
        env:
          BASE_COMMIT: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: |
          $changes = ./scripts/get-push-changes.ps1 -Before $env:BASE_COMMIT -After $env:GITHUB_SHA -Ref $env:GITHUB_REF
          "desktop=$($changes.Desktop.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@v6
        if: steps.changes.outputs.desktop != 'false'
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v7
        if: steps.changes.outputs.desktop != 'false'
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.desktop != 'false'
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check, build and test
        if: steps.changes.outputs.desktop != 'false'
        shell: pwsh
        run: ./scripts/check.ps1 -RequireActionRuntimes
      - name: Check repository and website
        if: steps.changes.outputs.desktop == 'false'
        shell: pwsh
        run: ./scripts/check.ps1 -SkipDesktop
      - name: Save check logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-logs
          path: artifacts/checks/
