name: Deploy SnapBar website

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact-name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # Always deploy current main, including when an older Release job is retried.
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Generate website with published Windows downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./scripts/build-site.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'snapbar-site')
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/snapbar-site

  # Finish the upload job before discovery: a freshly finalized artifact may
  # briefly be absent from the service listing when deployed in the same job.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: ${{ needs.build.outputs.artifact-name }}
