name: Deploy SnapBar website

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Always deploy current main, including when an older Release job is retried.
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Generate website with published Windows downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./scripts/build-site.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'snapbar-site')
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/snapbar-site
      - uses: actions/deploy-pages@v4
        id: deployment
