name: Publish Windows release
on:
  push:
    branches: ['**']
    tags: ['**']
  workflow_dispatch:
    inputs:
      version:
        description: Package version for validation only; no Release will be created
        required: true
        type: string
        default: v0.0.0-validation
  release:
    types: [published]
permissions:
  contents: read
jobs:
  changes:
    name: Classify push changes
    if: github.event_name == 'push' && !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      desktop: ${{ steps.classify.outputs.desktop }}
      website: ${{ steps.classify.outputs.website }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare the old and new commit trees
        id: classify
        shell: pwsh
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          $changes = ./scripts/get-push-changes.ps1 -Before $env:PUSH_BEFORE -After $env:GITHUB_SHA -Ref $env:GITHUB_REF
          "desktop=$($changes.Desktop.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "website=$($changes.Website.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
  windows-package:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.changes.outputs.desktop == 'true') }}
    permissions:
      contents: write
    uses: ./.github/workflows/windows-package.yml
    with:
      version: ${{ inputs.version || '' }}
  website:
    name: Deploy website
    needs: [changes, windows-package]
    if: >-
      ${{ !cancelled() &&
          ((needs.windows-package.result == 'success' &&
            (github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))) ||
           (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
            needs.changes.outputs.desktop == 'false' && needs.changes.outputs.website == 'true')) }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
